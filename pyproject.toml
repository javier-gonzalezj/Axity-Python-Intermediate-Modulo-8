[project]
name = "libreria"
version = "0.1.0"
description = "Programa de administracion de mi libreria. Python Intermediate"
authors = [
    {name = "Javier Gonzalez Jeronimo",email = "javier.gonzalezj@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.36,<3.0.0)",
    "alembic (>=1.16,<2.0.0)",
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
]

[tool.poetry]
packages = [{include = "libreria", from = "src"}]

[tool.poetry.scripts]
libreria = "libreria.main:main"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (orden de imports)
    "UP",  # pyupgrade (sintaxis moderna)
    "B",   # flake8-bugbear (errores comunes)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["libreria"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]   # mypy entiende mejor los modelos de pydantic

[[tool.mypy.overrides]]
# scikit-learn y joblib no incluyen anotaciones de tipos: mypy los trata como Any
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.9,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pandas-stubs (>=3.0.5.260914,<4.0.0.0)"
]
