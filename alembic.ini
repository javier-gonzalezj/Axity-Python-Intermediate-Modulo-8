# Configuración de Alembic (migraciones de la base de datos)
# Uso:  poetry run alembic upgrade head

[alembic]
# Carpeta con env.py y las migraciones
script_location = %(here)s/migraciones

# Agrega src/ al path para poder importar libreria
prepend_sys_path = src

# Nombres de archivo de las migraciones: 0001_descripcion.py, 0002_...
file_template = %%(rev)s_%%(slug)s

path_separator = os

# Base de datos (relativa a la carpeta desde donde ejecutas alembic)
sqlalchemy.url = sqlite:///data/libreria.db


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
